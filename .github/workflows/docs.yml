name: Sync batam-business API

on:
  repository_dispatch:
    types: [batam-business-api-updated]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout batam-business contract
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BATAM_BUSINESS_REPO }}
          ref: main
          path: .contracts/batam-business
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check contract sync
        id: before
        run: |
          if python scripts/sync_agency_contract.py --spec .contracts/batam-business/docs/api/openapi.json --check; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update registry
        if: steps.before.outputs.changed == 'true'
        run: python scripts/sync_agency_contract.py --spec .contracts/batam-business/docs/api/openapi.json

      - name: Validate generated DataMaster OpenAPI
        if: steps.before.outputs.changed == 'true'
        run: python scripts/gen_openapi.py

      - name: Run tests
        if: steps.before.outputs.changed == 'true'
        run: python -m compileall app scripts

      - name: Create pull request
        if: steps.before.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.client_payload.sha || 'manual' }}
        run: |
          BRANCH="chore/sync-batam-business-${SOURCE_SHA:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          rm -rf .contracts
          git add config.json docs/api/openapi.json
          git commit -m "chore: sync batam-business API contract"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync batam-business API contract" \
            --body "Automated API contract sync from batam-business.\n\nSource commit: ${SOURCE_SHA}\n\nThe registry endpoint paths, methods, parameters, required flags, and response fields were synchronized from batam-business OpenAPI."